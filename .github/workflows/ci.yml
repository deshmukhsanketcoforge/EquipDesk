name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required merge gate. Deterministic, no credentials. Runs exactly what
  # developers run locally: ruff + mypy + pytest (with coverage) against the
  # compose Postgres.
  test:
    name: test
    # A newer push cancels a superseded test run (cheap, no credentials).
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build test image
        run: docker compose build test

      - name: Lint, type-check and test
        run: docker compose run --rm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --profile test down --volumes

  # Decides whether live-eval runs: not for docs-only pull requests (Markdown or
  # docs/ only). Pushes to main and manual runs always run it.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes outside the docs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code_files=$(git diff --name-only "$BASE...$HEAD" | grep -Ev '^docs/|\.md$' || true)
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: live-eval is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs every case in evals/cases.yaml k times against the real model and scores
  # them (PLAN.md D12). Uses the FOUNDRY_* secrets, so pull requests from forks
  # (which get no secrets) skip it.
  live-eval:
    name: live-eval
    needs: [test, changes]
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Never cancelled halfway: a cancelled run has spent its tokens with no score.
    # A newer push waits for the running eval instead.
    concurrency:
      group: live-eval-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
      FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
      FOUNDRY_MODEL_DEPLOYMENT: ${{ secrets.FOUNDRY_MODEL_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the Foundry secrets are set
        run: |
          for name in FOUNDRY_API_KEY FOUNDRY_ENDPOINT FOUNDRY_MODEL_DEPLOYMENT; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The $name secret is not set."
              exit 1
            fi
          done

      - name: Start db and api, then seed the demo data
        run: |
          docker compose up --build --detach --wait api
          docker compose exec -T api python -m server.db.seed

      # The agent container runs as uid 10001; the checkout belongs to the runner.
      - name: Make the artifacts folder writable by the agent container
        run: mkdir -p artifacts/eval && chmod -R a+rwX artifacts

      - name: Run every case k times against the real model
        run: docker compose --profile demo run --rm -T agent python -m agent.run_demo --eval --out artifacts/eval

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f artifacts/eval/report.md ]; then
            cat artifacts/eval/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload traces, pass^k summary and token/cost report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-eval
          path: artifacts/eval
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes
